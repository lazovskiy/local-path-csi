{{- range .Values.storageClasses }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ required "storageClasses[].name is required" .name }}
  labels: {{- include "local-path-csi.labels" $ | nindent 4 }}
  {{- if .default }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
provisioner: {{ $.Values.driverName }}
# The volume is created on the node the scheduler picked for its first pod.
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: {{ .reclaimPolicy | default "Delete" }}
parameters:
  pool: {{ required "storageClasses[].pool is required" .pool | quote }}
  mobility: {{ .mobility | default "Pinned" | quote }}
  {{- with .dirMode }}
  dirMode: {{ . | quote }}
  {{- end }}
  {{- with .inodesPerGiB }}
  inodesPerGiB: {{ . | quote }}
  {{- end }}
  {{- with .deleteGracePeriod }}
  deleteGracePeriod: {{ . | quote }}
  {{- end }}
{{- end }}
