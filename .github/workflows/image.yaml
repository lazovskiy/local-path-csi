# Builds the image for amd64 and arm64 and pushes it to ghcr: under the given tags, or by its digest
# alone when there are none. The tests are not run in the build: checks.yaml has run them.
name: image

on:
  workflow_call:
    inputs:
      tags:
        description: Tags of the image, one per line; none pushes the image by its digest alone
        type: string
        default: ""
    outputs:
      image:
        description: Repository of the image, without a tag
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Digest of the image index
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: name
        id: name
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/local-path-csi"
          echo "image=$image" >>"$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            sed -n "s|^ *\([^ ]\+\) *$|$image:\1|p" <<<"$TAGS"
            echo EOF
          } >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: SKIP_TESTS=1
          # The index holds the two images and nothing else: pr-cleanup.sh deletes it with them.
          provenance: false
          sbom: false
          # The source links the package to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          tags: ${{ steps.name.outputs.tags }}
          push: ${{ steps.name.outputs.tags != '' }}
          outputs: ${{ steps.name.outputs.tags == '' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.name.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
